# Complete mapper configuration for optical_flow_dynamics_test.launch.yaml.
# RGB-D, camera calibration and GT TF come from the uHumans2 dataset config.
verbosity: 1
default_verbosity: 1
default_num_threads: 2
enable_lcd: false
enable_frontend_output: false
store_visualization_details: false

experiment:
  overwrite: false
  log_config: true
  log_timing: true
  log_timing_details: true
  save_every_n_frames: 0
  save_full_state: false

active_window:
  type: ActiveWindow
  verbosity: 1
  # Only throttle frontend/backend updates; dynamics still runs on every RGB-D frame.
  min_output_separation: 0.5
  use_object_priors: false

  dynamics_estimator:
    type: OpticalFlowDynamics
    scoring_mode: temporal       # legacy: previous fixed-reference chi-square scorer.
    debug_output: false          # Add fit/velocity diagnostics to the cloud only when needed.
    position_sigma_floor: 0.001  # m; unmodeled 3D error floor.
    depth_jump_relative: 0.02    # Relative tolerance for adjacent depth layers.
    depth_neighborhood_radius: 1 # px; expanded by bounded endpoint uncertainty.
    texture_variance_scale: 4.0  # Heuristic weak-texture variance inflation.
    fb_variance_scale: 1.0       # Heuristic cycle-error variance inflation.
    aperture_sigma: 1.0           # px along a direction at min_texture; 0 disables.
    ambiguity_check: true          # Skip flow the static prediction explains equally well.
    ambiguity_min_separation: 1.0  # px between flow endpoint and static prediction.
    photometric_tolerance: 3.0     # Mean abs 8-bit gray difference over 5x5 patches.
    min_fit_observations: 4      # Includes the valid reference sample.
    min_temporal_span: 0.1       # s
    min_reliability: 0.25
    max_fit_cdf: 0.99            # Approximate fit-quality gate, not motion probability.
    motion_penalty: 11.345       # LR-inspired penalty for three additional parameters.
    motion_score_scale: 10.0
    min_displacement: 0.02       # m over the accepted span.
    min_displacement_sigma: 3.0
    spatial_enabled: false      # Independent ablation switch.
    spatial_radius: 2            # px; single pass from direct measurements only.
    spatial_min_neighbors: 3
    spatial_min_reliability: 0.6
    spatial_color_sigma: 30.0    # RGB8 Euclidean distance.
    spatial_velocity_tolerance: 1.0 # m/s, local compatibility.
    spatial_motion_fraction: 0.7
    window_size: 5
    min_observations: 2
    max_frame_gap: 0.2             # Sensor time, unaffected by bag playback rate.
    max_window_duration: 1.0
    reference_pixel_sigma: 0.5  # Initial pixel localization standard deviation [px].
    flow_sigma: 0.5             # Per-step optical-flow standard deviation [px].
    depth_sigma: 0.01           # Depth standard-deviation floor [m].
    depth_sigma_scale: 0.001    # sigma_z = depth_sigma + depth_sigma_scale*z^2 [1/m].
    max_forward_backward_error: 1.0  # px
    max_depth_jump: 0.1           # m
    min_texture: 0.0001
    flow_levels: 3
    flow_window_size: 15
    flow_iterations: 3

  # Omitted optional motion_detector, object_detector, tracker and object_extractor
  # disable binary detections and object tracking for this test.
  frame_data_buffer:
    max_buffer_size: 2
    store_every_n_frames: 1

  # Khronos still maintains its background map; it does not consume these scores.
  volumetric_map:
    voxel_size: 0.1
    truncation_distance: 0.2
    voxels_per_side: 16
    with_semantics: false
  projective_integrator:
    num_threads: 2
  tracking_integrator:
    temporal_window: 3.0
    num_threads: 2

frontend:
  verbosity: 0
  enable_mesh_objects: false
  no_packet_collation: true
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.005

# Required pipeline backend. No loop closure, object merging or change detection.
backend:
  type: Backend
  verbosity: 0
  add_places_to_deformation_graph: false
  optimize_on_lc: false
  enable_node_merging: false
  add_merge_factor: false
  optimize_on_new_merge: false
  fix_input_poses: true
  pose_object_covariance: 0.1
  object_merge_covariance: 10.0
  pose_object_consistency_threshold: 0.2
  change_detection:
    run_every_n_frames: -1
  pgmo:
    run_mode: MESH_ONLY
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
    covariance:
      odom: 0.01
      loop_close: 0.05
      prior: 0.01
      mesh_mesh: 0.01
      pose_mesh: 0.01
      place_mesh: 0.01
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
      sg_loop_close: 0.1

# KhronosPipeline attaches this visualizer even when the scene-graph viewer is off.
visualization:
  global_frame_name: world
  queue_size: 1
