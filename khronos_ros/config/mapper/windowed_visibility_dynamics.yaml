# Complete mapper configuration for windowed_visibility_dynamics.launch.yaml: the
# optical-flow test mapper with dynamic_psg's correspondence-free windowed-visibility
# estimator, loaded from the dynamic_psg_khronos plugin library.
# RGB-D, camera calibration and GT TF come from the uHumans2 dataset config.
external_library_paths: [dynamic_psg_khronos]
verbosity: 1
default_verbosity: 1
default_num_threads: 2
enable_lcd: false
enable_frontend_output: false
store_visualization_details: false

experiment:
  overwrite: false
  log_config: true
  log_timing: true
  log_timing_details: true
  save_every_n_frames: 0
  save_full_state: false

# Hydra's bounded queues block rather than drop: if the active window is slower than
# playback, a backlog builds upstream and output lags. Keep play_rate low enough that
# the active window keeps up (see OPTICAL_FLOW_EVALUATION.md, sliding-window runtime).
input:
  max_receiver_queue_size: 1
  # Keep poses for longer than a whole bag: a backlog older than the TF buffer fails
  # every pose lookup (0.5 s each) and the input never recovers.
  tf_lookup:
    buffer_size_s: 300.0
  inputs:
    left_cam:
      receiver:
        queue_size: 2

active_window:
  max_input_queue_size: 1
  type: ActiveWindow
  verbosity: 1
  # Only throttle frontend/backend updates; dynamics still runs on every RGB-D frame.
  min_output_separation: 0.5
  use_object_priors: false

  dynamics_estimator:
    type: WindowedVisibilityDynamics
    # Other settings use the WindowedVisibilityDynamics::Config defaults; see
    # docs/windowed_visibility.md in dynamic_psg.
    # 10 frames with a keyframe every 0.3 s: a 2.7 s span. Points are dynamic if their place
    # was seen empty within the span (recently arrived, not necessarily moving now).
    window: {size: 10, keyframe_spacing: 0.3}

  # Omitted optional motion_detector, object_detector, tracker and object_extractor
  # disable binary detections and object tracking for this test.
  frame_data_buffer:
    max_buffer_size: 2
    store_every_n_frames: 1

  # Khronos still maintains its background map; it does not consume these scores.
  volumetric_map:
    voxel_size: 0.1
    truncation_distance: 0.2
    voxels_per_side: 16
    with_semantics: false
  projective_integrator:
    num_threads: 2
  tracking_integrator:
    temporal_window: 3.0
    num_threads: 2

frontend:
  verbosity: 0
  enable_mesh_objects: false
  no_packet_collation: true
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.005

# Required pipeline backend. No loop closure, object merging or change detection.
backend:
  type: Backend
  verbosity: 0
  add_places_to_deformation_graph: false
  optimize_on_lc: false
  enable_node_merging: false
  add_merge_factor: false
  optimize_on_new_merge: false
  fix_input_poses: true
  pose_object_covariance: 0.1
  object_merge_covariance: 10.0
  pose_object_consistency_threshold: 0.2
  change_detection:
    run_every_n_frames: -1
  pgmo:
    run_mode: MESH_ONLY
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
    covariance:
      odom: 0.01
      loop_close: 0.05
      prior: 0.01
      mesh_mesh: 0.01
      pose_mesh: 0.01
      place_mesh: 0.01
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
      sg_loop_close: 0.1

# KhronosPipeline attaches this visualizer even when the scene-graph viewer is off.
visualization:
  global_frame_name: world
  queue_size: 1
